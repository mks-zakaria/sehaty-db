services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sehaty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sehaty}
      POSTGRES_DB: ${POSTGRES_DB:-sehaty}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sehaty}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db_data:
