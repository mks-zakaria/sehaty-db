[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sehaty-db"
description = "Sehaty schema-of-record: SQLAlchemy 2.0 models + Pydantic data-definitions + packaged Alembic."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["version"]
dependencies = [
    "sqlalchemy>=2.0.36",
    "geoalchemy2>=0.15",
    "alembic>=1.14",
    "pydantic>=2.10",
    "psycopg[binary]>=3.2.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "python-semantic-release>=9"]

[project.scripts]
# Downstream services `pip install sehaty-db` then run `sehaty-migrate`.
sehaty-migrate = "sehaty.db._migrations.cli:main"

[tool.setuptools.dynamic]
# semantic-release rewrites _version.py; setuptools reads the literal via AST
# (no package import needed at build time).
version = { attr = "sehaty.db._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sehaty.db._migrations" = ["alembic.ini", "script.py.mako", "versions/*.py"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Alembic migration files are autogenerated — don't lint them.
extend-exclude = ["src/sehaty/db/_migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["sehaty"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.semantic_release]
major_on_zero = false
tag_format = "v{version}"
version_variables = ["src/sehaty/db/_version.py:__version__"]
commit_message = "Release {version}\n\n[skip ci] Automatically generated by python-semantic-release"
build_command = ""

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "MKS~ZAK <60817481+mks-zakaria@users.noreply.github.com>"

[tool.semantic_release.remote.token]
env = "GH_TOKEN"
