name: release
# Merge to main → auto version bump (semantic-release reads Conventional Commits).
# Pushing the "Release vX" commit back to protected main requires a PAT that can
# bypass the branch rule: set repo secret SEHATY_CI_PAT (falls back to GITHUB_TOKEN).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        options: [stable, rc]
        default: stable

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SEHATY_CI_PAT || secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v3
      - name: Configure git identity
        run: |
          git config user.name "MKS~ZAK"
          git config user.email "60817481+mks-zakaria@users.noreply.github.com"
      - run: uv sync --all-extras
      - name: semantic-release
        env:
          GH_TOKEN: ${{ secrets.SEHATY_CI_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.release_type }}" = "rc" ]; then
            uv run semantic-release version --no-vcs-release --print
          else
            uv run semantic-release version --commit --push --tag
          fi
