name: migrations-pr

# The gate in front of the schema. A migration that merges here is applied to
# production unattended minutes later — `deploy.yml` rebuilds the stack and the
# one-shot `migrate` service runs `alembic upgrade head` before the API is
# allowed to start — so this is the last place a human sees it.
#
# The graph checks come first and cost nothing. They exist because the two ways
# an Alembic repo breaks both fail *at deploy time* with errors that name every
# revision in the repo except the one at fault:
#
#   - a copy-pasted revision id ("Revision X is present more than once", then
#     "Cycle is detected in revisions (…all 35 of them…)");
#   - two branches each adding a migration off the same parent, which leaves two
#     heads and makes `upgrade head` ambiguous.
#
# Both are a one-character fix and a ten-minute read. Naming the offending file
# here turns that into a line of CI output.

on:
  pull_request:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sehaty
          POSTGRES_PASSWORD: sehaty
          POSTGRES_DB: sehaty
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sehaty" --health-interval 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://sehaty:sehaty@localhost:5432/sehaty
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --frozen

      # Named before Alembic is asked anything, because Alembic's own error for
      # this lists every revision in the repo and not the duplicated id.
      - name: No duplicate revision ids
        run: |
          dups=$(grep -h '^revision' src/sehaty/db/_migrations/versions/*.py | sort | uniq -d)
          test -z "$dups" || { echo "::error::duplicate revision id(s): $dups"; grep -l "$(echo "$dups" | head -1 | cut -d'"' -f2)" src/sehaty/db/_migrations/versions/*.py; exit 1; }

      # `upgrade head` on the droplet needs "head" to mean one thing.
      - name: Exactly one migration head
        run: |
          uv run alembic -c src/sehaty/db/_migrations/alembic.ini heads | tee /tmp/heads.txt
          test "$(grep -c '(head)' /tmp/heads.txt)" -eq 1 || { echo "::error::expected one Alembic head, found $(grep -c '(head)' /tmp/heads.txt) — rebase, or join them with 'alembic merge'"; exit 1; }

      # Apply every revision, roll back one, re-apply, then fail on ORM/DB drift.
      - run: uv run alembic -c src/sehaty/db/_migrations/alembic.ini upgrade head
      - run: uv run alembic -c src/sehaty/db/_migrations/alembic.ini downgrade -1 || true
      - run: uv run alembic -c src/sehaty/db/_migrations/alembic.ini upgrade head
      - run: uv run alembic -c src/sehaty/db/_migrations/alembic.ini check
